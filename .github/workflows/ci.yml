name: CI/CD Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

jobs:
  # ===================================================
  # 1. CI JOB: Runs for all branch pushes and PRs to main
  # ===================================================
  ci:
    name: Continuous Integration (Lint, Test, Build)
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build application
        run: npm run build

  # ===================================================
  # 2. CD JOB: Runs ONLY after CI succeeds on main branch
  #    (Covers direct push to main OR merge into main)
  # ===================================================
  cd:
    name: Continuous Deployment (Deploy to Render)
    needs: ci
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not configured in GitHub repository secrets."
            exit 1
          fi

          echo "Triggering deployment on Render..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          
          echo "Render Response Code: $HTTP_STATUS"
          cat response.txt

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Deploy hook failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

          echo "Render deployment successfully triggered!"